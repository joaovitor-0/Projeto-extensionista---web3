{% load static %}

<!DOCTYPE html>
<html>
	<head>
		<title>GAVIME - Editar Ação</title>
		<meta charset = 'UTF-8'>
		<link rel="stylesheet" href="{% static 'css/style.css' %}">
		<link rel="icon" href="{% static 'img/icon.ico' %}">
		<meta name = 'viewport' content = 'width=device-width, initial-scale=1.0'>
	</head>

	<body id = 'topo'>
		<header>
			<div class = 'cabecalho'>

				<a href = "/funcionarios/">
					<img src = "{% static 'img/logoGavime.png' %}" class = 'logo' alt = 'Logo GAVIME'>
				</a>

				<nav>
					<a href = "/funcionarios/">Painel</a>
					<a href = "/funcionarios/atividades/">Ações</a>
					<a href = "/funcionarios/inscritos/">Inscritos</a>
					<a href = "/funcionarios/voluntarios/">Voluntários</a>
					<a href="/funcionarios/despesas/">Transparência</a>
					<a href = "/funcionarios/newsletter/">Newsletter</a>
					<a href = "/">Site principal</a>
				</nav>

			</div>
		</header>

		<section class = 'conteudo'>
			<div class = 'topoPainel'>
				<h1>Editar ação</h1>
			</div>

			<h1>Alterar dados da ação</h1>

			<form class = 'formularioPagina' method = 'POST' onsubmit = 'return confirmarAlteracao()'>
				{% csrf_token %}

				<div class = 'campo'>
					<label>Nome da ação</label>
					<input type = 'text' name = 'nome_atividade' value = "{{ atividade.nome_atividade }}" required>
				</div>

				<div class = 'campo'>
					<label>Descrição</label>
					<textarea name = 'descricao'>{{ atividade.descricao }}</textarea>
				</div>

				<div class = 'campo'>
					<label>Data da ação</label>
					<input type = 'date' name = 'data_atividade' value = "{{ atividade.data_atividade|date:'Y-m-d' }}">
				</div>

				<div class = 'campo'>
					<label>Local da ação</label>
					<input type = 'text' name = 'local_atividade' value = "{{ atividade.local_atividade }}">
				</div>

				<div class = 'campo'>
					<label>Quantidade de vagas</label>
					<input type = 'number' name = 'quantidade_vagas' value = "{{ atividade.quantidade_vagas }}">
				</div>

				<div class = 'campo'>

					<label>Status da ação</label>
					<select name = 'status_atividade' required>
						<option value = 'Aberta' {% if atividade.status_atividade == 'Aberta' %}selected{% endif %} >
							Aberta
						</option>

						<option value = 'Em andamento' {% if atividade.status_atividade == 'Em andamento' %}selected{% endif %} >
							Em andamento
						</option>

						<option value = 'Encerrada' {% if atividade.status_atividade == 'Encerrada' %}selected{% endif %} >
							Encerrada
						</option>
					</select>
				</div>

				<button class = 'botaoEnviar' type = 'submit'>
					Salvar alterações
				</button>
			</form>
		</section>

		<footer>
			<div class="footerContainerFuncionarios">
				<div class="footerLogo">
					<a href="#topo">
						<img src="{% static 'img/logoGavime.png' %}" class="logoFooter" alt="Logo GAVIME">
					</a>
				</div>

				<p class="direitos">
					©2026 - GAVIME. Todos os direitos reservados.
				</p>
			</div>
		</footer>

		<script src = "{% static 'js/atividades.js' %}"></script>
	</body>
</html>
